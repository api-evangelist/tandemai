aid: tandemai
name: TandemAI
description: TandemAI is an integrated drug discovery contract research organization (CRO)
  that combines proprietary AI and physics-based computational methods with in-house
  high-performance computing and extensive wet-lab operations to accelerate pharmaceutical
  research. Its cloud-enabled, data-centric, browser-based platform, TandemViz, spans
  hit finding, hit-to-lead and lead optimization, digital assays and workflows, medicinal
  chemistry and synthesis, biological assays, and a peptide platform. TandemAI is offered
  as an FTE-based service model that bundles wet-lab services with complimentary access
  to its AI and computational tools, or as a stand-alone SaaS software license. The
  company merged with Perpetual Medicines and is backed by Qiming Venture Partners.
